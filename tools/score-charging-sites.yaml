name: score-charging-sites
description: Calculate transparent weighted suitability scores for valid candidate sites.
input_schema:
  type: object
  additionalProperties: false
  required: [candidates]
  properties:
    candidates:
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: true
    weights:
      type: object
      additionalProperties: false
      properties:
        demand_score:
          type: number
          minimum: 0
        access_score:
          type: number
          minimum: 0
        grid_readiness_score:
          type: number
          minimum: 0
        cost_score:
          type: number
          minimum: 0
        constraint_score:
          type: number
          minimum: 0
